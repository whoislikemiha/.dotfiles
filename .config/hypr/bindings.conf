# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

bindd = SUPER, return, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --private
bindd = SUPER, S, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER, D, Docker, exec, omarchy-launch-tui lazydocker
# bindd = SUPER, G, Signal, exec, omarchy-launch-or-focus signal "uwsm app -- signal-desktop"
bindd = SUPER, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm-app -- obsidian"
bindd = SUPER, slash, Passwords, exec, uwsm app -- 1password

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER, A, Claude, exec, omarchy-launch-webapp "https://claude.ai/new"
bindd = SUPER, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
bindd = SUPER, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
# bindd = SUPER ALT, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
# Cycle keyboard layout (US → Serbian Latin → Serbian Cyrillic)
bindd = SUPER, Alt_R, Switch keyboard layout, exec, hyprctl switchxkblayout all next

# Workspace hotkeys
# Free Q/W/E/R from the old app/close bindings, then use them for the left 4K monitor.
unbind = SUPER, Q
unbind = SUPER, W
unbind = SUPER, E
unbind = SUPER, R
bindd = SUPER, X, Close active window, killactive,

bindd = SUPER, Q, Left workspace q, workspace, 11
bindd = SUPER, W, Left workspace w, workspace, 12
bindd = SUPER, E, Left workspace e, workspace, 13
bindd = SUPER, R, Left workspace r, workspace, 14

bindd = SUPER SHIFT, Q, Move window to left workspace q, movetoworkspace, 11
bindd = SUPER SHIFT, W, Move window to left workspace w, movetoworkspace, 12
bindd = SUPER SHIFT, E, Move window to left workspace e, movetoworkspace, 13
bindd = SUPER SHIFT, R, Move window to left workspace r, movetoworkspace, 14

bindd = SUPER, F, Force full screen, fullscreen, 0

# Fast float toggle. Keep the old Super+Shift+V default too, but Super+V is the quick path.
unbind = SUPER, V
bindd = SUPER, V, Toggle window floating/tiling, togglefloating,

# Window navigation
bindd = SUPER, H, Focus left window, movefocus, l
bindd = SUPER, L, Focus right window, movefocus, r
bindd = SUPER, K, Focus up window, movefocus, u
bindd = SUPER, J, Focus down window, movefocus, d

# Navigate to next/previous workspace
bindd = SUPER CTRL, L, Next workspace, workspace, m+1
bindd = SUPER CTRL, H, Previous workspace, workspace, m-1

# Workspace switching - cycle between current and previous workspace
# First unbind the Omarchy default
unbind = SUPER, TAB
bindd = SUPER, TAB, Previous workspace, workspace, previous

