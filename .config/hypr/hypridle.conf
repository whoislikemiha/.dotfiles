# Display-off only. Locking is handled by the Omarchy shell (idle.lock in
# ~/.config/omarchy/shell.json), so this file just blanks the screens as a
# screensaver replacement and wakes them on activity.
general {
    lock_cmd = omarchy-system-lock
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock
    after_sleep_cmd = sleep 1 && omarchy-system-wake
    inhibit_sleep = 3
}

listener {
    # 3 min: black fullscreen surface instead of cutting the DP signal.
    # On an OLED black pixels are off, so burn-in protection still holds, but the
    # link stays up and waking is instant -- no modeset, no input re-detection.
    # It must be a layer-shell overlay, not a window: mapping a fullscreen
    # window counts as activity and fires on-resume immediately.
    timeout = 180
    ignore_inhibit = false
    on-timeout = /home/miha/.local/bin/omarchy-black-screensaver start
    on-resume = /home/miha/.local/bin/omarchy-black-screensaver stop
}

listener {
    # 20 min (5 min after the lock): only now actually power the panel down.
    # This is the expensive one -- the ASUS drops to standby and takes ~15s to
    # re-acquire the 4K@240 link -- so it is deliberately far out.
    #
    # omarchy-brightness-display on is NOT used to undo it: its "already lit?"
    # guard reads hyprctl monitors .dpmsStatus, which this Hyprland reports as
    # true even while /sys/class/drm/card1-DP-1/dpms says Off, so it always
    # exits before dispatching. Dispatch the DPMS enable directly instead.
    timeout = 1200
    ignore_inhibit = false
    on-timeout = omarchy-brightness-display off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && omarchy-brightness-keyboard restore
}
