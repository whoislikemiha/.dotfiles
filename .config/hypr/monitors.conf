# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale
# You must relaunch Hyprland after changing any envs (use Super+Esc, then Relaunch)

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
# env = GDK_SCALE,2
# monitor=,preferred,auto,auto

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.666667

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# DP-1 is the 32" ASUS 4K monitor, placed to the left of the LG ultrawide.
env = GDK_SCALE,1
monitor=DP-1,3840x2160@240,-3072x0,1.25
monitor=DP-2,2560x1080@143.94501,0x0,1

# Left 4K main monitor: Aerospace-style letter slots (shown in Waybar as q/w/e/r)
# Mark q/11 as the monitor default so Hyprland does not boot DP-1 into the
# first unclaimed numeric workspace (10) before a left-monitor app opens.
workspace = 11, monitor:DP-1, persistent:true, default:true
workspace = 12, monitor:DP-1, persistent:true
workspace = 13, monitor:DP-1, persistent:true
workspace = 14, monitor:DP-1, persistent:true

# Right ultrawide: regular numbered workspaces
workspace = 1, monitor:DP-2, persistent:true, default:true
workspace = 2, monitor:DP-2, persistent:true
workspace = 3, monitor:DP-2, persistent:true
workspace = 4, monitor:DP-2, persistent:true
workspace = 5, monitor:DP-2, persistent:true
workspace = 6, monitor:DP-2, persistent:true
workspace = 7, monitor:DP-2, persistent:true
workspace = 8, monitor:DP-2, persistent:true
workspace = 9, monitor:DP-2, persistent:true

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2
