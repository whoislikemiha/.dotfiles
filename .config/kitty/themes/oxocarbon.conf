# Oxocarbon color scheme for Kitty
# Based on IBM Carbon Design System

# Basic colors
foreground              #f2f4f8
background              #161616
selection_foreground    #161616
selection_background    #33b1ff

# Cursor colors
cursor                  #33b1ff
cursor_text_color       #161616

# URL underline color when hovering with mouse
url_color               #78a9ff

# Kitty window border colors
active_border_color     #33b1ff
inactive_border_color   #525252
bell_border_color       #ee5396

# OS Window titlebar colors
wayland_titlebar_color  #161616
macos_titlebar_color    #161616

# Tab bar colors
active_tab_foreground   #161616
active_tab_background   #33b1ff
inactive_tab_foreground #dde1e6
inactive_tab_background #262626
tab_bar_background      #161616

# Colors for marks (marked text in the terminal)
mark1_foreground #161616
mark1_background #78a9ff
mark2_foreground #161616
mark2_background #ee5396
mark3_foreground #161616
mark3_background #42be65

